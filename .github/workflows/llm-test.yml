name: LLM test
on: workflow_dispatch
permissions:
  models: read
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for m in openai/gpt-4o-mini openai/gpt-4.1-mini; do
            echo "== $m"
            curl -sS -m 40 -i -X POST https://models.github.ai/inference/chat/completions \
              -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" \
              -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"Say hi in three words.\"}]}" | grep -viE "^(set-cookie|x-github-request|x-ms|apim)" | head -30
          done
          echo "== catalog"
          curl -sS -m 40 https://models.github.ai/catalog/models -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" | head -c 1500
