name: Setup
description: Installs Node, Python, FFmpeg, the voice model and the render browser, all cached.
inputs:
  render:
    description: Set to "false" for jobs that do not render video.
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci --no-audit --no-fund
      shell: bash
    - if: inputs.render == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - if: inputs.render == 'true'
      uses: actions/cache@v4
      with:
        path: |
          models
          node_modules/.remotion
        key: media-tools-${{ runner.os }}-kokoro-v1.0-${{ hashFiles('package-lock.json') }}
    - if: inputs.render == 'true'
      shell: bash
      run: |
        pip install -q -r requirements.txt
        bash scripts/fetch-models.sh
        command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
